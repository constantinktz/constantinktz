<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="Sprachverteilung nach Codegröße">
  <title>Sprachverteilung</title>
  <style>
    svg{--bg:#FFFFFF;--panel:#F6F8FA;--line:#D0D7DE;--text:#1F2328;--muted:#59636E;--mono:ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace;--sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}
    .bg{fill:var(--bg)}
    .cap{font-family:var(--mono);font-size:17px;fill:var(--muted);letter-spacing:1.6px}
    .lang{font-family:var(--mono);font-size:19px;fill:var(--text)}
    .pct{font-family:var(--mono);font-size:18px;fill:var(--muted)}
    .track{fill:var(--panel);stroke:var(--line);stroke-width:1}
    .glow{fill:url(#gl);animation:run 6.5s cubic-bezier(.45,0,.55,1) infinite}
    @keyframes run{0%{transform:translateX(-200px)}70%,100%{transform:translateX(1030px)}}
    .g0{animation-delay:0.00s}
    .g1{animation-delay:0.16s}
    .g2{animation-delay:0.32s}
    .g3{animation-delay:0.48s}
    .g4{animation-delay:0.64s}
    .g5{animation-delay:0.80s}
    .g6{animation-delay:0.96s}
    @media (prefers-reduced-motion:reduce){.glow{display:none}}
  </style>
  <defs>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1A7F37" stop-opacity="0"/>
      <stop offset=".5" stop-color="#1A7F37" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#1A7F37" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect class="bg" width="1280" height="380"/>
