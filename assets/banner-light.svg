<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Constantin Kautz — Fullstack von Python-Backends und KI bis TypeScript-Frontends und Flutter-Apps">
  <title>Constantin Kautz</title>
  <style>
    svg{
      --bg:#FFFFFF; --panel:#F6F8FA; --line:#D0D7DE;
      --text:#1F2328; --muted:#59636E;
      --accent:#1A7F37; --accent2:#0969DA;
      --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
      --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    .bg{fill:var(--bg)}

    /* ---- Ambience: alles endlos, 0% = Ruhezustand ---- */
    .gridline{stroke:var(--line);stroke-width:1}
    .grid{animation:drift 20s linear infinite}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(44px,44px)}}

    .blob{filter:url(#soft)}
    .blob-a{fill:var(--accent);opacity:.17;animation:floatA 22s ease-in-out infinite}
    .blob-b{fill:var(--accent2);opacity:.14;animation:floatB 28s ease-in-out infinite}
    @keyframes floatA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(58px,-20px) scale(1.14)}}
    @keyframes floatB{0%,100%{transform:translate(0,0) scale(1.05)}50%{transform:translate(-50px,24px) scale(.9)}}

    /* ---- statisch lesbarer Inhalt ---- */
    .kicker{font-family:var(--mono);font-size:15px;letter-spacing:3px;fill:var(--muted)}
    .kdot{fill:var(--accent);animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

    .wm{font-family:var(--sans);font-weight:800;font-size:74px;letter-spacing:-2.4px;fill:var(--text)}
    .wm2{fill:url(#acc)}
    .rule{stroke:url(#acc);stroke-width:3;stroke-linecap:round}
    .tag{font-family:var(--mono);font-size:16px;fill:var(--muted);letter-spacing:.2px}

    .sheen{fill:url(#sheen);animation:sheen 8s cubic-bezier(.5,0,.5,1) infinite}
    @keyframes sheen{0%{transform:translateX(-150px);opacity:0}12%{opacity:1}58%{opacity:0}100%{transform:translateX(620px);opacity:0}}

    /* ---- Schichten rechts: Frontend / Backend / Mobile ---- */
    .layer{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
    .ring{fill:none;stroke:var(--accent);stroke-width:1.5;opacity:0;
      animation:lit 9s ease-in-out infinite}
    .ltitle{font-family:var(--mono);font-size:19px;fill:var(--text);letter-spacing:1.4px}
    .lsub{font-family:var(--mono);font-size:15px;fill:var(--muted)}
    .l1 .ring{animation-delay:0s}   .l1 .ltitle{animation:hot 9s ease-in-out 0s infinite}
    .l2 .ring{animation-delay:2.4s} .l2 .ltitle{animation:hot 9s ease-in-out 2.4s infinite}
    .l3 .ring{animation-delay:4.8s} .l3 .ltitle{animation:hot 9s ease-in-out 4.8s infinite}
    @keyframes lit{0%,100%{opacity:0}4%,14%{opacity:1}20%{opacity:0}}
    @keyframes hot{0%,100%{fill:var(--text)}4%,14%{fill:var(--accent)}20%{fill:var(--text)}}

    .rail{stroke:var(--line);stroke-width:2}
    .railflow{stroke:url(#accv);stroke-width:2;stroke-linecap:round;
      stroke-dasharray:30 230;animation:down 9s linear infinite}
    @keyframes down{from{stroke-dashoffset:260}to{stroke-dashoffset:0}}
    .bead{fill:var(--accent)}

    .baseline{stroke:var(--line);stroke-width:2}
    .flow{stroke:url(#acc);stroke-width:2;stroke-linecap:round;stroke-dasharray:24 216;
      animation:flow 4.5s linear infinite}
    @keyframes flow{from{stroke-dashoffset:240}to{stroke-dashoffset:0}}

    @media (prefers-reduced-motion:reduce){
      .grid,.blob-a,.blob-b,.kdot,.sheen,.railflow,.flow,.bead{animation:none}
      .ring,.ltitle{animation:none}
      .ring{opacity:.3}
    }
  </style>

  <defs>
    <!-- userSpaceOnUse: sonst degeneriert der Gradient auf waagerechten Linien (bbox-Höhe 0) -->
    <linearGradient id="acc" gradientUnits="userSpaceOnUse" x1="60" y1="60" x2="1220" y2="300">
      <stop offset="0" stop-color="#1A7F37"/>
      <stop offset="1" stop-color="#0969DA"/>
    </linearGradient>
    <linearGradient id="accv" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="300">
      <stop offset="0" stop-color="#1A7F37"/>
      <stop offset="1" stop-color="#0969DA"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1A7F37" stop-opacity="0"/>
      <stop offset=".5" stop-color="#1A7F37" stop-opacity=".5"/>
      <stop offset="1" stop-color="#1A7F37" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="78"/>
    </filter>
    <radialGradient id="fade" cx="28%" cy="42%" r="74%">
      <stop offset="0" stop-color="#fff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridmask"><rect width="1280" height="340" fill="url(#fade)"/></mask>
    <clipPath id="wmclip"><rect x="60" y="92" width="600" height="152"/></clipPath>
    <path id="railpath" d="M690 48V296"/>
  </defs>

  <rect class="bg" width="1280" height="340"/>

  <g mask="url(#gridmask)">
    <g class="grid">
      <g class="gridline">
        <path d="M-44 0V340M0 0V340M44 0V340M88 0V340M132 0V340M176 0V340M220 0V340M264 0V340M308 0V340M352 0V340M396 0V340M440 0V340M484 0V340M528 0V340M572 0V340M616 0V340M660 0V340M704 0V340M748 0V340M792 0V340M836 0V340M880 0V340M924 0V340M968 0V340M1012 0V340M1056 0V340M1100 0V340M1144 0V340M1188 0V340M1232 0V340M1276 0V340"/>
        <path d="M0 -44H1280M0 0H1280M0 44H1280M0 88H1280M0 132H1280M0 176H1280M0 220H1280M0 264H1280M0 308H1280M0 352H1280"/>
      </g>
    </g>
  </g>

  <ellipse class="blob blob-a" cx="200" cy="90" rx="195" ry="130"/>
  <ellipse class="blob blob-b" cx="1010" cy="290" rx="205" ry="140"/>

  <circle class="kdot" cx="76" cy="49" r="4"/>
  <text class="kicker" x="94" y="54">@CONSTANTINKTZ · DORTMUND</text>

  <g clip-path="url(#wmclip)">
    <text class="wm" x="70" y="150">CONSTANTIN</text>
    <text class="wm wm2" x="70" y="220">KAUTZ</text>
    <rect class="sheen" x="60" y="92" width="130" height="152"/>
  </g>

  <path class="rule" d="M72 248H222"/>
  <text class="tag" x="72" y="286">Fullstack — von Python-Backends und KI</text>
  <text class="tag" x="72" y="308">bis TypeScript-Frontends und Flutter-Apps.</text>

  <!-- Schienen mit wanderndem Impuls -->
  <path class="rail" d="M690 48V296"/>
  <path class="railflow" d="M690 48V296"/>
  <circle class="bead" r="4.5">
    <animateMotion dur="9s" repeatCount="indefinite">
      <mpath href="#railpath"/>
    </animateMotion>
  </circle>

  <g class="l1">
    <rect class="layer" x="712" y="48" width="496" height="72" rx="13"/>
    <rect class="ring" x="706" y="42" width="508" height="84" rx="17"/>
    <text class="ltitle" x="740" y="80">FRONTEND</text>
    <text class="lsub" x="740" y="103">TypeScript · Vue · JavaScript</text>
  </g>

  <g class="l2">
    <rect class="layer" x="712" y="136" width="496" height="72" rx="13"/>
    <rect class="ring" x="706" y="130" width="508" height="84" rx="17"/>
    <text class="ltitle" x="740" y="168">BACKEND &amp; KI</text>
    <text class="lsub" x="740" y="191">Python · Java · C#</text>
  </g>

  <g class="l3">
    <rect class="layer" x="712" y="224" width="496" height="72" rx="13"/>
    <rect class="ring" x="706" y="218" width="508" height="84" rx="17"/>
    <text class="ltitle" x="740" y="256">MOBILE</text>
    <text class="lsub" x="740" y="279">Dart · Flutter</text>
  </g>

  <path class="baseline" d="M0 338H1280"/>
  <path class="flow" d="M0 338H1280"/>
</svg>
