<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-label="Constantin Kautz, Fullstack. Backend Python, Java, C#. Frontend TypeScript, Vue. Mobile Dart, Flutter.">
  <title>Constantin Kautz</title>
  <style>
    svg{
      --bg:#FFFFFF; --text:#1F2328; --muted:#59636E; --rule:#D8DEE4;
      --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
      --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    .bg{fill:var(--bg)}
    .wm{font-family:var(--sans);font-weight:800;font-size:88px;letter-spacing:-3px;fill:var(--text)}
    .key{font-family:var(--mono);font-size:16px;fill:var(--muted)}
    .val{font-family:var(--mono);font-size:19px;fill:var(--text)}
    .pos{font-family:var(--mono);font-size:17px;fill:var(--muted)}
    .rule{stroke:var(--rule);stroke-width:1}

    /* Aufbau beim Laden, einmalig. Startwerte gedimmt statt null, damit der
       Banner auch dort lesbar bleibt, wo nur der erste Frame gerendert wird. */
    @keyframes fade{from{opacity:.25}to{opacity:1}}
    @keyframes rise{from{opacity:.25;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes draw{from{stroke-dashoffset:1168}to{stroke-dashoffset:0}}
    .f{animation:fade .7s ease-out both}
    .r{animation:rise .7s cubic-bezier(.2,.8,.25,1) both}
    .d{stroke-dasharray:1168;animation:draw .9s cubic-bezier(.2,.8,.25,1) both}
    .l1{animation-delay:.04s}.l2{animation-delay:.12s}
    .k1{animation-delay:.26s}.k2{animation-delay:.33s}.k3{animation-delay:.40s}
    .p{animation-delay:.50s}

    @media (prefers-reduced-motion:reduce){
      .f,.r{animation:none;opacity:1;transform:none}
      .d{animation:none;stroke-dashoffset:0}
    }
  </style>

  <rect class="bg" width="1280" height="330"/>

  <text class="wm r l1" x="56" y="148">CONSTANTIN</text>
  <text class="wm r l2" x="56" y="236">KAUTZ</text>

  <g>
    <text class="key f k1" x="812" y="110">BACKEND</text>
    <text class="val f k1" x="952" y="110">Python  Java  C#</text>
    <text class="key f k2" x="812" y="152">FRONTEND</text>
    <text class="val f k2" x="952" y="152">TypeScript  Vue</text>
    <text class="key f k3" x="812" y="194">MOBILE</text>
    <text class="val f k3" x="952" y="194">Dart  Flutter</text>
  </g>

  <path class="rule d" d="M56 268H1224"/>
  <text class="pos f p" x="56" y="298">Fullstack. Python-Backends und KI, TypeScript-Frontends, Flutter auf Mobile.</text>
</svg>
